{
  "agent": {
    "system_template": "You are an autonomous terminal-use agent operating a Linux computer to complete real-world tasks:\noffice documents, web browsers, media files, application and system settings, scientific tools.\nYou work by issuing bash commands and reading their output. Nobody will answer questions, so decide for yourself.\nYou are graded only on the final state of files and applications, checked against the task statement literally.\n",
    "instance_template": "Please complete this task: {{task}}\n\n## How you work\n\n1. You issue at least one command (as a bash tool call), the system runs it in a fresh subshell, you see the result, you decide the next command.\n2. Directory and environment-variable changes do not persist between commands. Prefix commands with `cd /path && ...` when needed.\n3. Every response MUST contain at least one bash tool call. Reasoning text before the call is welcome but keep it short.\n4. Each command has a time limit. Run long jobs in the background (`nohup CMD > /tmp/out.log 2>&1 &`) and poll the log.\n\n## Working rules\n\n1. Read the task statement twice. Write down every concrete requirement: output path and name, file format, exact values or settings, the final state the application or browser must be left in.\n2. Inspect the inputs before acting (`ls -la`, `file`, `head`, open the document and print its content). Find out which tools are installed (`which`, `--help`) before assuming.\n3. Before modifying a file that already exists, keep a backup copy in /tmp. Never destroy the original unless the task asks for it.\n4. Prefer robust high-level tools over hand-editing internals: python-docx/openpyxl/python-pptx/odfpy or `soffice --headless --convert-to` for office files, Pillow/ImageMagick/ffmpeg for media, the application's own CLI or configuration files for settings. Do not hand-write Office XML.\n5. If you write spreadsheet formulas with a library, the cached values will be empty until the file is recalculated by a spreadsheet application; either recalculate and save with LibreOffice headless or write the literal values the task asks for.\n6. GUI applications may be running on a virtual display (check `echo $DISPLAY`, `ps aux`, `xdotool`, `wmctrl`). Settings of GUI applications usually live in their profile/config files; changes made while the application is running may be overwritten, so close it first or use its own command-line interface, then restart it if the task requires it to be open.\n7. Write outputs to the exact path, name and format requested. Do not add extra files next to them and do not rename inputs.\n8. Before finishing, verify your work the way a grader would: re-open the produced file and print the relevant content, print the setting, or check the window/tab state. Fix problems you find.\n9. If something fails twice in the same way, stop repeating it: re-check the assumption behind it (path, tool, syntax, running process) or take a different route.\n\n## Submission\n\nWhen the task is complete and verified, finish by issuing exactly this command on its own: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`\nDo not combine it with any other command. After it you cannot continue working.\n\n<system_information>\n{{system}} {{release}} {{version}} {{machine}}\n</system_information>\n\n## Useful command examples\n\n```bash\n# create a file\ncat <<'EOF' > /tmp/script.py\nprint(\"hello\")\nEOF\n\n# view numbered lines\nnl -ba file.txt | sed -n '10,40p'\n\n# replace text in place (backup first)\ncp file.txt /tmp/file.txt.bak && sed -i 's/old/new/g' file.txt\n\n# inspect an office file quickly\npython3 -c \"import openpyxl; wb=openpyxl.load_workbook('f.xlsx', data_only=True); ws=wb.active; print([[c.value for c in r] for r in ws.iter_rows(max_row=10)])\"\n```\n",
    "step_limit": 150,
    "cost_limit": 0.0,
    "wall_time_limit_seconds": 2200,
    "max_consecutive_format_errors": 10,
    "mode": "yolo",
    "whitelist_actions": [],
    "confirm_exit": false,
    "budget_notices": true,
    "budget_wrapup_fraction": 0.8,
    "stall_detection": true,
    "stall_window": 6,
    "stall_repeat_threshold": 3,
    "verify_gate": true,
    "verify_gate_max": 1,
    "verify_gate_timeout": 90,
    "observation_hygiene": true,
    "hygiene_head_lines": 80,
    "hygiene_tail_lines": 40,
    "hygiene_max_chars": 8000,
    "compact_keep_last": 8,
    "compact_head_chars": 400,
    "agent_class": "minisweagent.agents.tua.TuaAgent"
  },
  "model": {
    "model_name": "openrouter/qwen/qwen3.7-flash",
    "model_kwargs": {
      "drop_params": true,
      "extra_body": {
        "provider": {
          "order": [
            "Alibaba"
          ],
          "allow_fallbacks": false
        },
        "reasoning": {
          "enabled": false
        }
      }
    },
    "litellm_model_registry": null,
    "set_cache_control": null,
    "cost_tracking": "ignore_errors",
    "format_error_template": "{% if finish_reason is defined and (finish_reason == \"length\" or (finish_reason == \"tool_calls\" and not has_tool_calls)) -%}\nYour previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a tool call, so it was cut off. Respond more concisely and finish with exactly one bash tool call. If you need to think more, do so briefly.\n{%- else -%}\nYour last response contained no valid bash tool call, so nothing was executed.\n\n<error>\n{{error}}\n</error>\n\n- If you believe the task is complete and verified: issue the submit command `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` as a bash tool call, alone.\n- Otherwise keep working: every response must contain at least one bash tool call with arguments {\"command\": \"...\"}.\n- Nobody can answer questions here; decide using the task statement and what you can observe.\n{%- endif %}\n",
    "observation_template": "{%- if output.output | length < 10000 -%}\n{\n  \"returncode\": {{ output.returncode }},\n  \"output\": {{ output.output | tojson }}\n  {%- if output.exception_info %}, \"exception_info\": {{ output.exception_info | tojson }}{% endif %}\n}\n{%- else -%}\n{\n  \"returncode\": {{ output.returncode }},\n  \"output_head\": {{ output.output[:5000] | tojson }},\n  \"output_tail\": {{ output.output[-5000:] | tojson }},\n  \"elided_chars\": {{ output.output | length - 10000 }},\n  \"warning\": \"Output too long.\"\n  {%- if output.exception_info %}, \"exception_info\": {{ output.exception_info | tojson }}{% endif %}\n}\n{%- endif -%}\n",
    "multimodal_regex": "",
    "model_class": "minisweagent.models.litellm_model.LitellmModel"
  },
  "environment": {
    "cwd": "",
    "env": {
      "PAGER": "cat",
      "MANPAGER": "cat",
      "LESS": "-R",
      "PIP_PROGRESS_BAR": "off",
      "TQDM_DISABLE": "1"
    },
    "timeout": 120,
    "environment_class": "minisweagent.environments.local.LocalEnvironment"
  }
}
